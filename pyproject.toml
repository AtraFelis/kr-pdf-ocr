[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-ocr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["paddleocr==3.3.0", "pypdf", "pypdfium2", "pillow", "psutil"]

[project.optional-dependencies]
cpu = ["paddlepaddle==3.2.0"]
gpu = ["paddlepaddle-gpu==3.2.2"]
dev = ["ruff", "pytest"]
vl = ["torch==2.9.1", "torchvision==0.24.1", "transformers>=5.0,<6"]
text = ["kiwipiepy==0.24.0"]
gui = ["PySide6-Essentials==6.10.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D419"]
